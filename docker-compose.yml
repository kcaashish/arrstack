name: media-stack
networks:
  media-network:
    driver: bridge
services:
  ####################################################################
  # Reverse Proxy
  ####################################################################
  caddy:
    image: caddy:2.11.4
    # build:
    #   context: .
    #   dockerfile: inline-caddy.Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # environment:
    #   CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_DIR}/appdata/caddy/data:/data
      - ${MEDIA_DIR}/appdata/caddy/config:/config
    depends_on:
      - jellyfin
      - seerr
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Jellyfin
  ####################################################################
  jellyfin:
    # always use linuxserver image for jellyfin, will get error with ghcr image
    # after initial config is already done
    image: linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${MEDIA_DIR}/appdata/jellyfin:/config
      - ${MEDIA_DIR}/media:/data/media
    devices:
      - /dev/dri:/dev/dri
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Seerr
  ####################################################################
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: debug
    volumes:
      - ${MEDIA_DIR}/appdata/seerr:/app/config
    depends_on:
      - jellyfin
    restart: unless-stopped
    networks:
      - media-network
    labels:
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # qBittorrent
  ####################################################################
  qbittorrent:
    image: linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - ${MEDIA_DIR}/appdata/qbittorrent:/config
      - ${MEDIA_DIR}/torrents:/data/torrents
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "8080:8080"
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Prowlarr
  ####################################################################
  prowlarr:
    image: linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${MEDIA_DIR}/appdata/prowlarr:/config
    depends_on:
      - qbittorrent
    ports:
      - "9696:9696"
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Sonarr
  ####################################################################
  sonarr:
    image: linuxserver/sonarr:4.0.19
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${MEDIA_DIR}/appdata/sonarr:/config
      - ${MEDIA_DIR}/torrents:/data/torrents
      - ${MEDIA_DIR}/media/tv:/data/media/tv
    depends_on:
      - qbittorrent
      - prowlarr
    ports:
      - "8989:8989"
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Radarr
  ####################################################################
  radarr:
    image: linuxserver/radarr:6.3.0
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${MEDIA_DIR}/appdata/radarr:/config
      - ${MEDIA_DIR}/torrents:/data/torrents
      - ${MEDIA_DIR}/media/movies:/data/media/movies
    depends_on:
      - qbittorrent
      - prowlarr
    ports:
      - "7878:7878"
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Portainer
  ####################################################################
  # portainer:
  #   image: portainer/portainer-ce:lts
  #   container_name: portainer
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ${MEDIA_DIR}/appdata/portainer:/data
  #   ports:
  #     - "9443:9443"
  #   networks:
  #     - media-network
  #####################################################################
  # Flaresolverr
  #####################################################################
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    networks:
      - media-network
    ports:
      - "8191:8191"
    restart: unless-stopped
    labels:
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$"
  #####################################################################
  # Bazarr
  #####################################################################
  bazarr:
    image: linuxserver/bazarr:1.6.0
    container_name: bazarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${MEDIA_DIR}/appdata/bazarr:/config
      - ${MEDIA_DIR}/media:/data/media # Crucial: Must be identical to Radarr/Sonarr mappings
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  ####################################################################
  # Watchtower
  ####################################################################
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   restart: unless-stopped
  #   environment:
  #     TZ: ${TZ}
  #     WATCHTOWER_CLEANUP: "true"
  #     WATCHTOWER_SCHEDULE: "0 0 4 * * *"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  ####################################################################
  # What's up docker
  ####################################################################
  wud:
    image: ghcr.io/getwud/wud:8.3.1
    container_name: wud
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: persist WUD's local database so history isn't lost on restart
      - ${MEDIA_DIR}/appdata/wud:/store
    environment:
      - TZ=${TZ}
      # --- CRON SCHEDULE ---
      # Schedule format: Min Hour Day Month DayOfWeek
      # Example: "0 4 * * *" checks every day at 4:00 AM
      - WUD_WATCHER_LOCAL_CRON=0 12 * * *
      # - WUD_WATCHER_LOCAL_CRON=* * * * *
      # --- NOTIFICATION TRIGGER (e.g., Discord) ---
      # WUD uses modular "Triggers". Enable Discord notifications:
      - WUD_TRIGGER_DISCORD_MYDISCORD_URL=${WUD_DISCORD_WEBHOOK_URL}
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
  #####################################################################
  # Cloudflared
  #####################################################################
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      TZ: ${TZ}
    depends_on:
      - caddy
    networks:
      - media-network
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$"
